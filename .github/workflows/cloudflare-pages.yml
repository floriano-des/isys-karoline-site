name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check script.js
          node --check motion.js
      - name: Prepare public files
        run: |
          mkdir -p "$RUNNER_TEMP/isys-site"
          cp -- index.html 404.html styles.css script.js motion.js _redirects "$RUNNER_TEMP/isys-site/"
          cp -R -- assets "$RUNNER_TEMP/isys-site/assets"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.147.0 pages deploy "$RUNNER_TEMP/isys-site" --project-name=isys-karoline --branch=main --commit-dirty=false
